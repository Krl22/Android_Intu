<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intu · Opciones de splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #08817E; --teal-dark: #066663; --indigo: #1E1F47; --gold: #EFB11B;
    --cream: #FBFAF6; --muted: #5F6570; --orange: #E8601C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--indigo);
    background: #EEF0F2; min-height: 100vh;
  }
  header { max-width: 1100px; margin: 0 auto; padding: 32px 16px 8px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
  .grid {
    max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px;
    display: grid; gap: 32px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); justify-items: center;
  }
  figure { margin: 0; display: grid; gap: 14px; justify-items: center; width: 300px; }
  .phone {
    width: 300px; height: 650px; border-radius: 40px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #15161F, 0 24px 60px -20px rgba(0,0,0,.45);
  }
  .phone svg { width: 100%; height: 100%; display: block; }
  figcaption { text-align: center; display: grid; gap: 4px; }
  figcaption b { font-size: 18px; }
  figcaption span { color: var(--muted); font-size: 14px; line-height: 1.45; }
  button {
    font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 999px; cursor: pointer;
    padding: 9px 18px; background: var(--teal); color: #fff;
  }
  button:hover { background: var(--teal-dark); }
  .word { font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800; letter-spacing: -1.6px; }
  .tag { font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 600; letter-spacing: .4px; }

  /* Movimientos comunes */
  .anim { animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  @keyframes grow-up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes drop-bounce {
    0% { transform: translateY(-140px); opacity: 0; }
    55% { transform: translateY(8px); opacity: 1; }
    75% { transform: translateY(-5px); }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes rise-in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hills { from { transform: translateY(70px); } to { transform: none; } }
  @keyframes sun { from { transform: translateY(90px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes mist { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
  @keyframes bob { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-8deg); } 70% { transform: rotate(4deg); } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fly { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  @keyframes shrink { from { transform: scale(1.5); } to { transform: scale(.75); } }
  @keyframes vanish { to { opacity: 0; } }
  @keyframes flap-up { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes flap-down { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

  /* Opción A: Amanecer en la selva */
  .a .sun { transform-box: fill-box; animation: sun 1.6s .1s both cubic-bezier(.2,.8,.2,1); }
  .a .h1 { animation: hills 1.1s .05s both cubic-bezier(.2,.8,.2,1); }
  .a .h2 { animation: hills 1.1s .15s both cubic-bezier(.2,.8,.2,1); }
  .a .h3 { animation: hills 1.1s .25s both cubic-bezier(.2,.8,.2,1); }
  .a .mist { animation: mist 6s ease-in-out infinite alternate, fade-in 1.2s .6s both; }
  .a .bird { animation: fade-in .8s 1.05s both; }
  .a .bird-head { transform-box: fill-box; transform-origin: 20% 90%; animation: bob 1s 1.9s both ease-in-out; }
  .a .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow-up .5s .45s both cubic-bezier(.3,1.4,.5,1); }
  .a .dot { animation: drop-bounce .7s .8s both; }
  .a .word { animation: rise-in .6s 1.25s both cubic-bezier(.2,.8,.2,1); }
  .a .tag { animation: rise-in .6s 1.45s both cubic-bezier(.2,.8,.2,1); }

  /* Opción B: El punto que vuela */
  .b .flyer {
    offset-path: path('M-30,470 C 20,380 60,300 110,262 C 130,247 142,246 150,250');
    offset-rotate: 0deg;
    animation: fly 1.25s .1s both cubic-bezier(.35,.1,.25,1), vanish .15s 1.3s forwards;
  }
  .b .flyer-body { transform-box: fill-box; transform-origin: center; animation: shrink 1.25s .1s both ease-in; }
  .b .wing-up { animation: flap-up .22s steps(1) 6 .1s both; }
  .b .wing-down { animation: flap-down .22s steps(1) 6 .1s both; }
  .b .dot { transform-box: fill-box; transform-origin: center; animation: pop .45s 1.3s both cubic-bezier(.3,1.4,.5,1); }
  .b .bar { transform-box: fill-box; transform-origin: 50% 0%; animation: grow-up .45s 1.45s both cubic-bezier(.3,1.4,.5,1); }
  .b .word { animation: rise-in .6s 1.7s both cubic-bezier(.2,.8,.2,1); }
  .b .tag { animation: rise-in .6s 1.9s both cubic-bezier(.2,.8,.2,1); }
  .b .leaf { animation: fade-in 1s .2s both; }

  /* Opción C: Ruta a Satipo */
  .c .topo { animation: fade-in 1.2s both; }
  .c .watermark { animation: fade-in 1.6s .3s both; }
  .c .route { --len: 1100; stroke-dasharray: 1100; animation: draw 1.4s .1s both cubic-bezier(.45,.05,.3,1), vanish .5s 1.9s forwards; }
  .c .rider {
    offset-path: path('M30,640 C 90,600 215,610 232,540 C 250,470 110,478 104,408 C 98,340 214,338 214,292 C 214,262 184,250 150,250');
    offset-rotate: 0deg; animation: fly 1.4s .1s both cubic-bezier(.45,.05,.3,1);
  }
  .c .bar { transform-box: fill-box; transform-origin: 50% 0%; animation: grow-up .45s 1.5s both cubic-bezier(.3,1.4,.5,1); }
  .c .word { animation: rise-in .6s 1.75s both cubic-bezier(.2,.8,.2,1); }
  .c .tag { animation: rise-in .6s 1.95s both cubic-bezier(.2,.8,.2,1); }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<header>
  <h1>Splash de Intu: 3 opciones</h1>
  <p>Duran unos 2 segundos, lo que tarda la app en revisar tu sesión. Las tres terminan igual, con el logo y «intu», y el gallito de las rocas aparece de forma sutil. Toca «Repetir» para verlas otra vez.</p>
</header>

<main class="grid">
  <!-- ============ A ============ -->
  <figure>
    <div class="phone a" data-screen>
      <svg viewBox="0 0 300 650" role="img" aria-label="Opción A: amanecer en la selva">
        <defs>
          <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0A928E"/><stop offset="1" stop-color="#06605D"/>
          </linearGradient>
          <radialGradient id="a-sun"><stop offset="0" stop-color="#EFB11B" stop-opacity=".55"/><stop offset="1" stop-color="#EFB11B" stop-opacity="0"/></radialGradient>
          <symbol id="gallito" viewBox="0 0 120 100">
            <path d="M36,70 L16,90 Q20,95 26,93 L44,76 Z"/>
            <path d="M32,66 C32,52 44,44 60,46 C74,48 82,58 80,70 C78,80 66,86 52,85 C40,84 32,77 32,66 Z"/>
            <path class="bird-head" d="M58,54 C54,36 62,18 80,14 C96,11 108,22 108,36 C108,42 105,47 100,50 C92,51 86,53 80,56 C72,59 62,59 58,54 Z"/>
            <path d="M52,84 L50,92 M60,84 L60,92" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M0,94 Q60,86 120,96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </symbol>
        </defs>
        <rect width="300" height="650" fill="url(#a-bg)"/>
        <circle class="sun" cx="150" cy="500" r="120" fill="url(#a-sun)"/>
        <path class="h1" d="M0,520 C55,485 105,498 150,480 C200,462 245,485 300,470 L300,650 L0,650 Z" fill="#0A7572"/>
        <ellipse class="mist" cx="120" cy="522" rx="150" ry="14" fill="#fff" fill-opacity=".07"/>
        <path class="h2" d="M0,560 C48,538 95,552 140,534 C188,516 236,548 300,530 L300,650 L0,650 Z" fill="#07625F"/>
        <g class="h2">
          <g class="bird" color="#054A48" fill="#054A48">
            <use href="#gallito" x="192" y="470" width="86" height="72"/>
          </g>
        </g>
        <path class="h3" d="M0,600 C65,578 112,600 178,584 C225,573 262,590 300,583 L300,650 L0,650 Z" fill="#054A48"/>

        <rect class="bar" x="138" y="272" width="24" height="54" rx="12" fill="#fff"/>
        <circle class="dot" cx="150" cy="248" r="14" fill="#EFB11B"/>
        <text class="word" x="150" y="392" text-anchor="middle" font-size="46" fill="#fff">intu</text>
        <text class="tag" x="150" y="424" text-anchor="middle" font-size="14" fill="#fff" fill-opacity=".75">Tu mototaxi, a un toque</text>
      </svg>
    </div>
    <figcaption>
      <b>A · Amanecer en la selva</b>
      <span>Fondo turquesa, sale el sol detrás de los cerros de Satipo y el gallito aparece como silueta sobre una rama. Es la más «Satipo».</span>
    </figcaption>
    <button type="button" data-replay>Repetir</button>
  </figure>

  <!-- ============ B ============ -->
  <figure>
    <div class="phone b" data-screen>
      <svg viewBox="0 0 300 650" role="img" aria-label="Opción B: el punto que vuela">
        <rect width="300" height="650" fill="#FBFAF6"/>
        <g class="leaf" fill="#08817E" fill-opacity=".07">
          <path d="M-20,660 C20,560 90,540 120,560 C90,600 40,640 -20,660 Z"/>
          <path d="M320,-10 C290,80 230,110 200,95 C220,50 270,10 320,-10 Z"/>
          <path d="M330,640 C270,600 250,540 270,515 C305,540 325,590 330,640 Z"/>
        </g>
        <g class="flyer">
          <g class="flyer-body">
            <g transform="translate(-30,-22)">
              <path d="M13,21 L1,16 L2,27 L13,25 Z" fill="#1E1F47"/>
              <ellipse cx="26" cy="22" rx="14" ry="8" fill="#E8601C"/>
              <path d="M32,20 C30,10 36,4 44,4 C52,4 57,10 56,16 C55,19 53,21 50,22 C45,23 38,24 32,20 Z" fill="#E8601C"/>
              <circle cx="48" cy="13" r="1.3" fill="#1E1F47"/>
              <path class="wing-up" d="M18,18 C16,6 26,-2 36,1 C31,7 29,13 29,19 Z" fill="#1E1F47"/>
              <path class="wing-down" d="M18,24 C16,36 26,43 36,40 C31,34 29,29 29,24 Z" fill="#1E1F47"/>
            </g>
          </g>
        </g>
        <circle class="dot" cx="150" cy="250" r="14" fill="#EFB11B"/>
        <rect class="bar" x="138" y="274" width="24" height="54" rx="12" fill="#08817E"/>
        <text class="word" x="150" y="394" text-anchor="middle" font-size="46" fill="#1E1F47">intu</text>
        <text class="tag" x="150" y="426" text-anchor="middle" font-size="14" fill="#5F6570">Tu mototaxi, a un toque</text>
      </svg>
    </div>
    <figcaption>
      <b>B · El punto que vuela</b>
      <span>Un gallito pequeño cruza volando y se posa justo donde va el punto de la «i»: el gallito <i>es</i> el punto. Fondo claro, divertida y breve.</span>
    </figcaption>
    <button type="button" data-replay>Repetir</button>
  </figure>

  <!-- ============ C ============ -->
  <figure>
    <div class="phone c" data-screen>
      <svg viewBox="0 0 300 650" role="img" aria-label="Opción C: ruta a Satipo">
        <rect width="300" height="650" fill="#FFFFFF"/>
        <g class="topo" fill="none" stroke="#08817E" stroke-opacity=".08" stroke-width="1.2">
          <path d="M-20,120 C60,90 120,150 200,120 C260,98 290,130 330,110"/>
          <path d="M-20,150 C60,120 120,180 200,150 C260,128 290,160 330,140"/>
          <path d="M-20,180 C60,150 120,210 200,180 C260,158 290,190 330,170"/>
          <path d="M-20,470 C40,440 110,500 180,470 C240,446 280,480 330,460"/>
          <path d="M-20,500 C40,470 110,530 180,500 C240,476 280,510 330,490"/>
          <path d="M-20,530 C40,500 110,560 180,530 C240,506 280,540 330,520"/>
        </g>
        <g class="watermark" fill="none" stroke="#08817E" stroke-opacity=".22" stroke-width="1" stroke-linejoin="round">
          <path transform="translate(118,462) scale(1.55)" d="M36,70 L16,90 Q20,95 26,93 L44,76 Z M32,66 C32,52 44,44 60,46 C74,48 82,58 80,70 C78,80 66,86 52,85 C40,84 32,77 32,66 Z M58,54 C54,36 62,18 80,14 C96,11 108,22 108,36 C108,42 105,47 100,50 C92,51 86,53 80,56 C72,59 62,59 58,54 Z M40,62 C50,54 66,56 76,66 C70,76 54,78 38,72 Z M64,44 C64,30 72,20 84,18 C96,17 104,26 104,36 M52,84 L50,91 M60,84 L60,91 M0,93 Q60,86 124,95"/>
          <circle transform="translate(118,462) scale(1.55)" cx="91" cy="41" r="2.2"/>
        </g>
        <path class="route" d="M30,640 C 90,600 215,610 232,540 C 250,470 110,478 104,408 C 98,340 214,338 214,292 C 214,262 184,250 150,250"
              fill="none" stroke="#08817E" stroke-width="5" stroke-linecap="round"/>
        <g class="rider"><circle r="14" fill="#EFB11B"/><circle r="20" fill="#EFB11B" opacity=".25"/></g>
        <rect class="bar" x="138" y="274" width="24" height="54" rx="12" fill="#08817E"/>
        <text class="word" x="150" y="394" text-anchor="middle" font-size="46" fill="#1E1F47">intu</text>
        <text class="tag" x="150" y="426" text-anchor="middle" font-size="14" fill="#5F6570">Tu mototaxi, a un toque</text>
      </svg>
    </div>
    <figcaption>
      <b>C · Ruta a Satipo</b>
      <span>Una ruta se dibuja como en el mapa y el mototaxi (el punto dorado) llega a su destino: la «i». El gallito queda como marca de agua muy suave.</span>
    </figcaption>
    <button type="button" data-replay>Repetir</button>
  </figure>
</main>

<script>
  // Repetir: reinicia las animaciones de esa pantalla
  document.querySelectorAll('[data-replay]').forEach(btn => {
    btn.addEventListener('click', () => {
      const screen = btn.closest('figure').querySelector('[data-screen]');
      const svg = screen.querySelector('svg');
      screen.replaceChild(svg.cloneNode(true), svg);
    });
  });
  // ?t=0.8 congela todas las animaciones en ese segundo (para revisar un momento exacto)
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!Number.isNaN(t)) {
    addEventListener('load', () => document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; }));
  }
</script>
</body>
</html>
