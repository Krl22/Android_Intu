#intu-nav-options .intu-expanded .intu-nav { flex:.8; }
#intu-nav-options .intu-expanded .intu-nav[aria-current='page'] { flex:1.4; flex-direction:row; gap:8px; background:var(--intu-accent); color:#fff; border-radius:18px; }
#intu-nav-options .intu-dock .intu-bar { margin:28px 14px 0; padding:8px 6px; border-radius:var(--intu-radius,24px); background:#1e1f47; }
#intu-nav-options .intu-dock .intu-nav { color:#c5cbdc; padding-top:9px; }
#intu-nav-options .intu-dock .intu-nav[aria-current='page'] { color:#fff; }
#intu-nav-options .intu-dock .intu-nav[aria-current='page'] .intu-icon { width:48px; height:48px; margin-top:-29px; border-radius:18px; background:var(--intu-accent); border:4px solid var(--intu-bg); }
#intu-nav-options .intu-nav { transition:background-color .2s,color .2s,flex .2s; }
@media(prefers-reduced-motion:reduce) { #intu-nav-options .intu-nav { transition:none; } }
@media(max-width:360px) { #intu-nav-options .intu-stage { padding:16px 0; } #intu-nav-options .intu-nav { min-width:58px; padding:6px; } }
</style>
<div id="intu-nav-options">
  <div class="viz-carousel viz-dotted-background" aria-label="Opciones de barra inferior para Intu" data-previous-label="Anterior" data-next-label="Siguiente">
    <section data-variant="Flotante" aria-label="Barra flotante">
      <div class="intu-stage"><div class="intu-preview intu-floating">
        <div class="intu-context"><div class="intu-brand">INTU</div><h3 class="intu-heading" aria-live="polite">Inicio</h3><div class="intu-body"><i data-lucide="map-pin" aria-hidden="true"></i><span>¿A dónde vamos?</span></div></div>
        <nav class="intu-bar" aria-label="Navegación flotante">

          <button class="intu-nav cursor-interaction" type="button" data-tab="Cuenta"><span class="intu-icon"><i data-lucide="user-round" aria-hidden="true"></i></span><span>Cuenta</span></button>
        </nav><div class="intu-gesture" aria-hidden="true"></div>
      </div></div>
    </section>
    <section data-variant="Minimalista" aria-label="Barra minimalista" hidden>
      <div class="intu-stage"><div class="intu-preview intu-minimal">
        <div class="intu-context"><div class="intu-brand">INTU</div><h3 class="intu-heading" aria-live="polite">Inicio</h3><div class="intu-body"><i data-lucide="map-pin" aria-hidden="true"></i><span>¿A dónde vamos?</span></div></div>
        <nav class="intu-bar" aria-label="Navegación minimalista">
          <button class="intu-nav cursor-interaction" type="button" data-tab="Inicio" aria-current="page"><span class="intu-icon"><i data-lucide="house" aria-hidden="true"></i></span><span>Inicio</span></button>
          <button class="intu-nav cursor-interaction" type="button" data-tab="Viajes"><span class="intu-icon"><i data-lucide="route" aria-hidden="true"></i></span><span>Viajes</span></button>
          <button class="intu-nav cursor-interaction" type="button" data-tab="Cuenta"><span class="intu-icon"><i data-lucide="user-round" aria-hidden="true"></i></span><span>Cuenta</span></button>
        </nav><div class="intu-gesture" aria-hidden="true"></div>
      </div></div>
    </section>
    <section data-variant="Pestaña expandida" aria-label="Barra con pestaña expandida" hidden>
      <div class="intu-stage"><div class="intu-preview intu-expanded">
        <div class="intu-context"><div class="intu-brand">INTU</div><h3 class="intu-heading" aria-live="polite">Inicio</h3><div class="intu-body"><i data-lucide="map-pin" aria-hidden="true"></i><span>¿A dónde vamos?</span></div></div>
        <nav class="intu-bar" aria-label="Navegación expandida">
          <button class="intu-nav cursor-interaction" type="button" data-tab="Inicio" aria-current="page"><span class="intu-icon"><i data-lucide="house" aria-hidden="true"></i></span><span>Inicio</span></button>
          <button class="intu-nav cursor-interaction" type="button" data-tab="Viajes"><span class="intu-icon"><i data-lucide="route" aria-hidden="true"></i></span><span>Viajes</span></button>
          <button class="intu-nav cursor-interaction" type="button" data-tab="Cuenta"><span class="intu-icon"><i data-lucide="user-round" aria-hidden="true"></i></span><span>Cuenta</span></button>
        </nav><div class="intu-gesture" aria-hidden="true"></div>
      </div></div>
    </section>
    <section data-variant="Dock elevado" aria-label="Barra oscura con icono elevado" hidden>
      <div class="intu-stage"><div class="intu-preview intu-dock">
        <div class="intu-context"><div class="intu-brand">INTU</div><h3 class="intu-heading" aria-live="polite">Inicio</h3><div class="intu-body"><i data-lucide="map-pin" aria-hidden="true"></i><span>¿A dónde vamos?</span></div></div>
        <nav class="intu-bar" aria-label="Navegación elevada">
          <button class="intu-nav cursor-interaction" type="button" data-tab="Inicio" aria-current="page"><span class="intu-icon"><i data-lucide="house" aria-hidden="true"></i></span><span>Inicio</span></button>
          <button class="intu-nav cursor-interaction" type="button" data-tab="Viajes"><span class="intu-icon"><i data-lucide="route" aria-hidden="true"></i></span><span>Viajes</span></button>
          <button class="intu-nav cursor-interaction" type="button" data-tab="Cuenta"><span class="intu-icon"><i data-lucide="user-round" aria-hidden="true"></i></span><span>Cuenta</span></button>

<script>
(() => {
  const root = document.getElementById('intu-nav-options');
  const copy = { Inicio:'¿A dónde vamos?', Viajes:'Tu historial de viajes', Cuenta:'Tu perfil y preferencias' };
  const saved = window.openai?.widgetState;
  const selection = saved?.privateContent?.tabs || {};
  function select(preview, tab) {
    preview.querySelectorAll('[data-tab]').forEach(button => {
      if (button.dataset.tab === tab) button.setAttribute('aria-current','page');
      else button.removeAttribute('aria-current');
    });
    preview.querySelector('.intu-heading').textContent = tab;
    preview.querySelector('.intu-body span').textContent = copy[tab];
  }
  root.querySelectorAll('.intu-preview').forEach(preview => {
    const name = preview.closest('[data-variant]').dataset.variant;
    if (copy[selection[name]]) select(preview, selection[name]);
    preview.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
      select(preview, button.dataset.tab);
      selection[name] = button.dataset.tab;
      window.openai?.setWidgetState?.({ modelContent:{ ultimaOpcionExplorada:name }, privateContent:{ tabs:selection } }).catch(() => {});
    }));
    if (globalThis.Tweak) {
      const state = { accent:'#08817e', radius:24 };
      const render = () => { preview.style.setProperty('--intu-accent',state.accent); preview.style.setProperty('--intu-radius',state.radius+'px'); };
      const tweak = new Tweak({ container:preview, onChange:render });
      preview.setAttribute('aria-label',name);
      tweak.addColorPicker(state,'accent',{label:'Color de selección',reference:'--intu-accent'});
      if (!preview.classList.contains('intu-minimal')) tweak.addSlider(state,'radius',{label:'Redondeado',min:12,max:36,unit:'px'});
    }
  });
  window.addEventListener('openai:set_globals', event => {
    const tabs = event.detail?.globals?.widgetState?.privateContent?.tabs || {};
    root.querySelectorAll('.intu-preview').forEach(preview => {
      const name = preview.closest('[data-variant]').dataset.variant;
      if (copy[tabs[name]]) { selection[name] = tabs[name]; select(preview,tabs[name]); }
    });
  });
})();
</script>
